version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    # Minor/patch bumps land as one PR instead of five, so they touch
    # package-lock.json once instead of conflicting with each other one
    # merge at a time. Majors stay their own PR — those need a real look.
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types: ['minor', 'patch']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions-minor-patch:
        applies-to: version-updates
        update-types: ['minor', 'patch']
