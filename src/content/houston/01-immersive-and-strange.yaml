  - name: Buffalo Bayou Park Cistern
    where: 105-B Sabine St
    why: A 1926 underground reservoir. 221 columns, a mile of LED cable strung over mirrored water, a 17-second echo. Speak into an intercom and your voice travels the room as light.
    tags:
      - - $15 · 30 min
      - - Wed–Sun only
        - warn
      - - Book ahead
        - warn
    filters:
      - indoor
      - book
    site: https://buffalobayou.org/2026-undercurrents/
    map: Buffalo Bayou Park Cistern Houston
