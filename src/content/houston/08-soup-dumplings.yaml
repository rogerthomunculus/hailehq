order: 8
title: Soup dumplings
note: Ranked on the dumplings themselves — wrapper, soup volume, whether they hold together. Notes on which ones can seat all nine of you.
items:
  - name: Wanna Bao
    where: Midtown · 2708 Bagby St
    why: The city's benchmark. Made to order, ~12-min wait, wrapper thin enough to be scary but doesn't tear. Pork or crab-and-pork.
    tags:
      - - Made to order
        - good
      - - 12-min wait
        - warn
      - - Open Monday
        - good
    filters:
      - food
      - indoor
      - mon
    site: https://wannabao.com/
    map: Wanna Bao Houston Bagby
  - name: One Dragon
    where: Asiatown · 9310 Bellaire Blvd
    why: Shanghainese mom-and-pop, thinnest skins in Houston. ~10 tables, closed Mondays. Get the crispy-bottom bao too.
    tags:
      - - ~10 tables
        - warn
      - - Closed Mondays
        - warn
    filters:
      - food
      - indoor
    map: One Dragon Restaurant Houston Bellaire
  - name: Loves Dumpling House
    where: Spring Branch · also Katy
    why: 4.7 with a big review count and a kitchen window where you watch them fold. Regulars argue it's passed One Dragon.
    tags:
      - - Open Monday
        - good
      - - Two locations
        - good
    filters:
