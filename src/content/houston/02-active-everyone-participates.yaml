  - name: Korean BBQ + karaoke
    where: 9889 Bellaire Blvd
    why: Hongdae 33 for all-you-can-eat, then a private karaoke room upstairs — two mics, YouTube, BYOB. Grill your own dinner, then nobody performs for strangers.
