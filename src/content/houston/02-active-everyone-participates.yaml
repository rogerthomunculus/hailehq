title: Active — everyone participates
note: Where this group is strongest. Ranked by how well the whole 7-to-17 spread is served at once.
items:
  - name: Buffalo Bayou kayak — bat tour
    where: Launches downtown
    why: Paddle 2.5 miles upstream at sunset, arrive under the bridge as 350,000 bats launch overhead, then float back under the skyline. Tandem kayaks available.
    tags:
      - - ~3 hrs
      - - Book ahead
        - warn
    filters:
      - active
      - book
