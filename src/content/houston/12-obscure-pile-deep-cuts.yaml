  - name: Sarabell Calabar
    where: Bissonnet St
    why: Nigerian buffet — five or six different soups with fufu, plus a hand-washing station by the door. One reviewer warns off small kids because the food is very rich and heavily spiced; your youngest is 10, probably fine, but know it going in.
