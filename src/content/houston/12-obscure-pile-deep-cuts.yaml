order: 12
title: Obscure pile — deep cuts
note: Deliberately unusual, mostly things this group hasn't done before. All ten are open Labor Day Monday.
items:
  - name: Patis & Toyo
    where: Katy
    why: 'The boodle fight: food spread straight onto banana leaves down the table, no plates, no utensils, everyone eats with their hands. Order it ahead. Best fit on either list for what this group responds to. 4.7 across 1,150.'
    tags:
