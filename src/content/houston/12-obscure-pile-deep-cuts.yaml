  - name: Mikiya Wagyu Shabu House
    where: Bellaire
    why: Everyone gets their own pot; tiers go up to A5 wagyu and Norway lobster. 4.9 across 1,578 — a tier above the usual AYCE hot pot rooms.
    tags:
