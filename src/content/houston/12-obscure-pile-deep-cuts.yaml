  - name: Foreign Grill
    where: inside POST Market, downtown
    why: Georgian khachapuri, the cheese-and-egg boat you stir into itself at the table, plus Uzbek plov. A stall rather than a restaurant, so it pairs with the rooftop rather than replacing a dinner.
